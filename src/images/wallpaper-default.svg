<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- 内置默认壁纸：不依赖网络，也不含第三方版权素材。
       视觉沿用 1.3.0 的「Graphite & Cobalt」——石墨底 + 一层克制的单色冷光，
       与预设壁纸「深邃星空」同源，但作为独立资源存在，避免默认态与预设态
       互相耦合（改预设不会悄悄换掉默认兜底）。 -->
  <defs>
    <radialGradient id="g1" cx="18%" cy="14%" r="62%">
      <stop offset="0%" stop-color="#2b3760" stop-opacity="0.85"/>
      <stop offset="58%" stop-color="#172136" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0e1014" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="84%" cy="20%" r="52%">
      <stop offset="0%" stop-color="#4f68db" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4f68db" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="88%" r="66%">
      <stop offset="0%" stop-color="#202a44" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0a0c10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="38%" stop-color="#111520"/>
      <stop offset="72%" stop-color="#0c0f17"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="76%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#g1)"/>
  <rect width="1920" height="1080" fill="url(#g2)"/>
  <rect width="1920" height="1080" fill="url(#g3)"/>
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
