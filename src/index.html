<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>凌睿科技导航页</title>
  <style>
    customize-chrome-button,
    cr-customize-button,
    ntp-customize-button,
    *[is="customize-chrome-button"],
    *[id*="customize" i],
    *[class*="customize" i] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      position: fixed !important;
      bottom: -9999px !important;
      right: -9999px !important;
      overflow: hidden !important;
    }
  </style>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/settings.css">
</head>
<body>
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-glow"></div>

  <div class="container" id="app">
    <header class="top-bar">
      <div class="datetime" id="datetime" data-component="calendar"></div>
      <div class="weather-widget" id="weatherWidget" data-component="weather">
        <span class="weather-loading">获取天气中...</span>
      </div>
    </header>

    <main class="main-content">
      <div class="title-group">
        <h1 class="site-title">凌睿科技导航</h1>
        <p class="site-subtitle">探索 · 发现 · 高效</p>
      </div>

      <div class="search-box" data-component="search">
        <div class="search-inner">
          <button class="engine-btn" id="engineBtn" title="切换搜索引擎" aria-label="切换搜索引擎">百度</button>
          <span class="search-divider" aria-hidden="true"></span>
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <path d="M21 21l-4.35-4.35" />
          </svg>
          <input type="text" id="searchInput" placeholder="搜索或输入网址..." autofocus aria-label="搜索或输入网址">
          <button class="search-clear" id="searchClear" aria-label="清空搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M18 6L6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <section class="quick-links" data-component="bookmarks">
        <div class="links-grid" id="bookmarkContainer"></div>
      </section>

      <div class="main-grid">
        <section class="categories" id="categoryContainer" data-component="categories"></section>
        <aside class="todo-card" data-component="todos">
          <div class="todo-header">
            <span class="todo-title">待办</span>
            <button class="todo-add-btn" id="todoAddBtn">+ 添加</button>
          </div>
          <div id="todoContent"></div>
        </aside>
      </div>
    </main>

    <footer class="bottom-bar">
      <button class="tool-btn" id="wallpaperBtn" title="切换壁纸" aria-label="切换壁纸" data-component="wallpaper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <path d="M21 15l-5-5L5 21" />
        </svg>
        <span>壁纸</span>
      </button>
      <button class="tool-btn" id="settingsBtn" title="设置" aria-label="打开设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l-.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
        </svg>
        <span>设置</span>
      </button>
    </footer>
  </div>

  <div class="toast-root" id="toastRoot" role="status" aria-live="polite"></div>

  <div class="settings-overlay" id="settingsOverlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-panel" tabindex="-1">
      <div class="settings-header">
        <h2 id="settingsTitle">设置</h2>
        <button class="settings-close" id="settingsClose" aria-label="关闭设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="settings-tabs" role="tablist" aria-label="设置分类">
        <button class="tab-btn active" id="tabBtnContent" data-tab="content" role="tab" aria-selected="true" aria-controls="tabContent">内容</button>
        <button class="tab-btn" id="tabBtnAppearance" data-tab="appearance" role="tab" aria-selected="false" aria-controls="tabAppearance">外观</button>
        <button class="tab-btn" id="tabBtnWeather" data-tab="weather" role="tab" aria-selected="false" aria-controls="tabWeather">天气</button>
        <button class="tab-btn" id="tabBtnData" data-tab="data" role="tab" aria-selected="false" aria-controls="tabData">数据与隐私</button>
      </div>
      <div class="settings-body">
        <div class="tab-content active" id="tabContent" role="tabpanel" aria-labelledby="tabBtnContent">
          <section class="setting-section">
            <div class="setting-section-head">
              <div>
                <div class="setting-section-title">快捷书签</div>
                <p class="setting-section-desc">主页搜索框下方的快捷入口，顺序与主页一致。</p>
              </div>
              <button class="btn-primary btn-sm" id="addBookmarkBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                <span>添加书签</span>
              </button>
            </div>
            <div class="item-list" id="bookmarkList"></div>
          </section>
          <section class="setting-section">
            <div class="setting-section-head">
              <div>
                <div class="setting-section-title">分类导航</div>
                <p class="setting-section-desc">按分类整理的链接集合，可逐个分类展开维护。</p>
              </div>
              <button class="btn-primary btn-sm" id="addCategoryBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                <span>添加分类</span>
              </button>
            </div>
            <div class="item-list" id="categoryList"></div>
          </section>
        </div>
        <div class="tab-content" id="tabAppearance" role="tabpanel" aria-labelledby="tabBtnAppearance">
          <div id="wallpaperSection"></div>
          <div id="componentsSection"></div>
        </div>
        <div class="tab-content" id="tabWeather" role="tabpanel" aria-labelledby="tabBtnWeather">
          <div class="setting-section">
            <div class="setting-section-title">选择省份</div>
            <p class="setting-section-desc">选择你所在的省份或直辖市</p>
            <select class="city-select" id="weatherProvinceSelect"></select>
          </div>
          <div class="setting-section">
            <div class="setting-section-title">选择城市</div>
            <p class="setting-section-desc">选择你所在的城市以获取准确的天气信息。选择"自动定位"时优先使用浏览器定位，取不到则回退到 IP 定位（城市级精度）。</p>
            <select class="city-select" id="weatherCitySelect"></select>
          </div>
        </div>
        <div class="tab-content" id="tabData" role="tabpanel" aria-labelledby="tabBtnData">
          <div id="dataSection"></div>
          <div id="privacySection"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/network-audit.js"></script>
  <script src="scripts/storage.js"></script>
  <script src="scripts/toast.js"></script>
  <script src="scripts/wallpaper.js"></script>
  <script src="scripts/weather.js"></script>
  <script src="scripts/lunar.min.js"></script>
  <script src="scripts/calendar.js"></script>
  <script src="scripts/todos.js"></script>
  <script src="scripts/settings.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
