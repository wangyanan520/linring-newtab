name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: 单元测试（node:test + 覆盖率）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 单元测试
        run: npm test
      - name: 覆盖率报告
        run: npm run test:coverage

  e2e-preview:
    name: E2E 冒烟（预览模式，headless）
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      - name: E2E 预览模式冒烟
        run: npm run test:e2e:preview
      # 生产存储后端回归：CI 无法跑扩展模式（需 GUI），用模拟的 chrome.storage
      # 覆盖同一批断言，避免"只在 chrome.storage 下出现"的缺陷逃逸
      - name: E2E chrome.storage 路径回归
        run: npm run test:e2e:shim
